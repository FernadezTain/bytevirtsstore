<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Поддержка — ByteVirts</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root{
    --bg:#0a0a0c; --bg-elevated:#101012; --surface:#17171b; --surface-2:#1e1e23;
    --border:#29292f; --border-soft:#212127;
    --accent:#ff3d1f; --accent-2:#ff8a3d; --accent-soft:rgba(255,61,31,.14);
    --spark:#ffb020; --success:#35d68f; --danger:#ff5c5c;
    --text:#f4f2ee; --text-muted:#9a9aa1; --text-faint:#5c5c63;
    --font-display:'Bebas Neue', sans-serif; --font-body:'Manrope', system-ui, sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    margin:0; min-height:var(--tg-vh, 100dvh); color:var(--text); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 600px at 12% -10%, rgba(255,61,31,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255,138,61,.08), transparent 55%),
      var(--bg);
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input, textarea{font-family:inherit;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 40px;}

  header.topbar{position:sticky; top:0; z-index:40; border-bottom:1px solid var(--border-soft); background:rgba(10,10,12,.85); backdrop-filter:blur(20px);}
  .topbar-inner{display:flex; align-items:center; gap:10px; padding:12px 16px; max-width:560px; margin:0 auto;}
  .logo-badge{width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:18px; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2)); flex-shrink:0;}
  .topbar-title{font-family:var(--font-display); font-size:18px; letter-spacing:.02em;}
  .back-btn{margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:8px 12px;}

  main{padding-top:20px;}
  .page-title{font-family:var(--font-display); font-size:26px; letter-spacing:.02em; color:#fff; margin:0 0 4px;}
  .page-sub{font-size:13.5px; color:var(--text-muted); margin:0 0 20px;}

  .auth-input{display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:12px 14px; margin-bottom:12px; transition:border-color .2s, box-shadow .2s;}
  .auth-input:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .auth-input svg{color:var(--text-muted); flex-shrink:0;}
  .auth-input input{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:14px;}
  .auth-input input::placeholder{color:var(--text-faint);}
  .btn-primary{width:100%; border-radius:16px; padding:13px; text-align:center; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent-2)); box-shadow:0 8px 24px rgba(255,61,31,.35); transition:transform .15s, filter .2s;}
  .btn-primary:hover{transform:translateY(-1px); filter:brightness(1.06);}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
  .btn-secondary{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border-radius:16px; border:1px solid var(--border); background:var(--surface); padding:12px; font-size:13.5px; font-weight:600; color:var(--text-muted);}
  .btn-secondary:hover{border-color:rgba(255,61,31,.4); color:var(--text);}
  .error-text{font-size:12px; color:var(--danger); margin:0 0 10px;}

  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tab{flex:1; text-align:center; border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); transition:background .2s, color .2s;}
  .tab.active{border-color:transparent; color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent-2));}

  .create-btn-row{margin-bottom:16px;}
  .create-btn{display:flex; align-items:center; justify-content:center; gap:8px;}

  .ticket-row{display:flex; align-items:center; gap:12px; border:1px solid var(--border-soft); background:var(--surface); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; transition:border-color .2s;}
  .ticket-row:hover{border-color:rgba(255,61,31,.4);}
  .ticket-icon{width:38px; height:38px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--bg-elevated); color:var(--text-faint);}
  .ticket-info{flex:1; min-width:0;}
  .ticket-subject{font-size:13.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px;}
  .ticket-meta{font-size:11.5px; color:var(--text-faint); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .ticket-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0;}
  .status-pill{font-size:10px; font-weight:700; letter-spacing:.02em; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .status-pill.new{color:var(--spark); background:rgba(255,176,32,.14);}
  .status-pill.active{color:var(--accent-2); background:rgba(255,61,31,.14);}
  .status-pill.closed{color:var(--text-faint); background:var(--bg-elevated);}
  .ai-tag{display:inline-block; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-2); margin-bottom:10px;}
  .empty{border:1px dashed var(--border); background:var(--surface); border-radius:16px; padding:32px; text-align:center; font-size:13px; color:var(--text-muted);}

  /* modal */
  .modal-overlay{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.65); backdrop-filter:blur(4px); padding:16px;}
  .modal-overlay.active{display:flex;}
  .modal-sheet{width:100%; max-width:440px; max-height:calc(100dvh - 32px); overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:22px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-head h2{font-family:var(--font-display); font-size:20px; letter-spacing:.02em; color:#fff; margin:0;}
  .modal-close{display:flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:10px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-muted);}
  .select-wrap{position:relative; display:flex; align-items:center; border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:12px 14px; margin-bottom:12px;}
  .select-wrap select{width:100%; background:transparent; border:none; outline:none; color:var(--text); font-size:14px; appearance:none; padding-right:20px; cursor:pointer;}
  .select-wrap select option{background:#1a1a1e; color:#fff;}
  .select-wrap::after{content:""; position:absolute; right:14px; top:50%; width:8px; height:8px; border-right:2px solid var(--text-muted); border-bottom:2px solid var(--text-muted); transform:translateY(-70%) rotate(45deg); pointer-events:none;}
  .textarea-wrap{align-items:flex-start; padding-top:12px;}
  .textarea-wrap textarea{flex:1; background:none; border:none; outline:none; resize:vertical; color:var(--text); font-size:14px; font-family:inherit; min-height:100px; line-height:1.5;}

  /* ticket detail / chat */
  .ticket-detail-head{border:1px solid var(--border-soft); background:var(--surface); border-radius:18px; padding:16px; margin-bottom:14px;}
  .ticket-detail-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px;}
  .ticket-detail-subject{font-size:15px; font-weight:700; color:#fff; line-height:1.35;}
  .ticket-detail-meta{font-size:11.5px; color:var(--text-faint);}
  .status-controls{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
  .status-controls button{flex:1; min-width:96px; font-size:11.5px; font-weight:600; padding:8px 10px; border-radius:10px; border:1px solid var(--border); color:var(--text-muted); background:var(--bg-elevated); transition:border-color .2s, color .2s;}
  .status-controls button.current{border-color:var(--accent-2); color:#fff; background:linear-gradient(90deg,var(--accent),var(--accent-2));}

  .chat-box{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .msg-row{display:flex;}
  .msg-row.mine{justify-content:flex-end;}
  .msg-bubble{max-width:80%; border-radius:16px; padding:10px 13px; font-size:13.5px; line-height:1.45; white-space:pre-line; word-break:break-word;}
  .msg-row:not(.mine) .msg-bubble{background:var(--surface-2); border:1px solid var(--border-soft); border-bottom-left-radius:4px;}
  .msg-row.mine .msg-bubble{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; border-bottom-right-radius:4px;}
  .msg-meta{font-size:10px; color:var(--text-faint); margin-top:4px; padding:0 3px;}
  .msg-row.mine .msg-meta{text-align:right;}

  .chat-input-row{display:flex; gap:8px; align-items:flex-end; position:sticky; bottom:12px; background:var(--bg); padding-top:6px;}
  .chat-input-row textarea{flex:1; resize:none; border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:12px 14px; color:var(--text); font-size:14px; font-family:inherit; max-height:120px; min-height:46px; outline:none;}
  .chat-input-row textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .chat-send-btn{flex-shrink:0; width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 6px 18px rgba(255,61,31,.35);}
  .chat-send-btn:disabled{opacity:.4; cursor:not-allowed;}
  .closed-notice{display:flex; align-items:center; gap:8px; border:1px solid var(--border-soft); background:var(--surface); border-radius:14px; padding:12px 14px; font-size:12.5px; color:var(--text-faint); justify-content:center;}

  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="logo-badge">B</span>
    <span class="topbar-title">Поддержка</span>
    <button class="back-btn" onclick="goHome()">← На сайт</button>
  </div>
</header>

<main class="wrap">
  <div id="loading-screen">
    <p style="text-align:center; color:var(--text-muted); padding:60px 0; font-size:13.5px;">Загрузка...</p>
  </div>

  <div id="auth-screen" style="display:none;">
    <h1 class="page-title">ВОЙДИТЕ В АККАУНТ</h1>
    <p class="page-sub">Используйте тот же ник и пароль, что и на основном сайте ByteVirts.</p>
    <form id="auth-form" onsubmit="handleLogin(event)">
      <div class="auth-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <input id="login-username" type="text" required placeholder="Ник" />
      </div>
      <div class="auth-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="login-password" type="password" required placeholder="Пароль" />
      </div>
      <p id="login-error" class="error-text" style="display:none;"></p>
      <button type="submit" class="btn-primary" id="login-btn">Войти</button>
    </form>
    <p style="margin-top:14px; font-size:12px; color:var(--text-faint); text-align:center;">Нет аккаунта? Зарегистрируйтесь на основном сайте.</p>
  </div>

  <div id="app-screen" style="display:none;">
    <div class="tabs" id="mode-tabs" style="margin-bottom:16px;"></div>

    <div id="tickets-mode">
      <div id="admin-tabs-wrap" style="display:none;">
        <div class="tabs" id="top-tabs"></div>
      </div>
      <div id="review-subtabs-wrap" style="display:none; margin-top:-6px;">
        <div class="tabs" id="review-subtabs"></div>
      </div>

      <div id="list-screen">
        <div class="create-btn-row" id="create-btn-row">
          <button type="button" class="btn-primary create-btn" onclick="openCreateModal()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            Создать обращение
          </button>
        </div>
        <div id="tickets-list"></div>
      </div>

      <div id="detail-screen" style="display:none;">
        <button class="btn-secondary" style="width:auto; padding:9px 14px; margin-bottom:14px;" onclick="closeDetail()">← Назад к списку</button>
        <div id="ticket-detail-body"></div>
      </div>
    </div>

    <div id="ai-screen" style="display:none;">
      <div class="ai-tag">ИИ ассистент</div>
      <div class="chat-box" id="ai-chat-box"></div>
      <div class="chat-input-row">
        <textarea id="ai-chat-input" rows="1" placeholder="Спросите AI-помощника..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAiMessage();}"></textarea>
        <button type="button" class="chat-send-btn" id="ai-send-btn" onclick="sendAiMessage()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>
  </div>
</main>

<div class="modal-overlay" id="create-overlay" onclick="if(event.target===this) closeCreateModal()">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Новое обращение</h2>
      <button class="modal-close" onclick="closeCreateModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form onsubmit="submitTicket(event)">
      <div class="auth-input">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        <input id="new-ticket-subject" type="text" required maxlength="200" placeholder="Заголовок обращения" />
      </div>
      <div class="select-wrap">
        <select id="new-ticket-category">
          <option value="product">Проблема с товаром</option>
          <option value="payment">Проблема с пополнением</option>
          <option value="account">Проблема с аккаунтом</option>
          <option value="other">Другое</option>
        </select>
      </div>
      <div class="auth-input textarea-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        <textarea id="new-ticket-message" required placeholder="Опишите проблему подробно..."></textarea>
      </div>
      <p id="create-error" class="error-text" style="display:none;"></p>
      <button type="submit" class="btn-primary" id="create-submit-btn">Отправить обращение</button>
    </form>
  </div>
</div>

<script>
let supabaseClient = null;
let currentUser = null;
let isAdminUser = false;
const AUTH_EMAIL_DOMAIN = "blackmarket-auth.com";

const CATEGORY_LABELS = { product: "Товар", payment: "Пополнение", account: "Аккаунт", other: "Другое" };
const STATUS_LABELS = { new: "На рассмотрении", active: "Активное", closed: "Закрыто" };

let currentMode = "tickets"; // 'tickets' | 'ai'
let currentTopTab = "mine"; // 'mine' | 'review' (только для админа)
let currentReviewSubtab = "active"; // 'active' | 'new' | 'closed'
let currentTicketId = null;
let currentTicketIsReview = false;
let pollTimer = null;
let lastRenderedSignature = null;

let aiMessages = []; // { role: 'user' | 'assistant', content, pending? }
let aiSending = false;

function goHome() {
  window.location.href = "index.html";
}

async function initSupabase() {
  try {
    const res = await fetch('/api/config');
    const cfg = await res.json();
    if (cfg.url && cfg.anonKey && window.supabase) {
      supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
    }
  } catch (e) {
    console.error('Не удалось получить конфигурацию:', e);
  }
}

async function apiFetch(url, options = {}) {
  const { data: { session } } = await supabaseClient.auth.getSession();
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (session?.access_token) headers['Authorization'] = `Bearer ${session.access_token}`;
  const res = await fetch(url, { ...options, headers });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || 'Ошибка запроса');
  return json;
}

function usernameToEmail(username) {
  return `${username.toLowerCase()}@${AUTH_EMAIL_DOMAIN}`;
}

async function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.style.display = "none";
  const btn = document.getElementById("login-btn");
  btn.disabled = true;
  btn.textContent = "Вход...";
  const { error } = await supabaseClient.auth.signInWithPassword({ email: usernameToEmail(username), password });
  btn.disabled = false;
  btn.textContent = "Войти";
  if (error) {
    errEl.textContent = "Неверный ник или пароль.";
    errEl.style.display = "block";
    return;
  }
  await bootApp();
}

async function bootApp() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) {
    document.getElementById("loading-screen").style.display = "none";
    document.getElementById("auth-screen").style.display = "block";
    document.getElementById("app-screen").style.display = "none";
    return;
  }
  currentUser = user;
  const { data: profile } = await supabaseClient.from("profiles").select("role").eq("id", user.id).single();
  isAdminUser = profile?.role === "admin";

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";

  if (isAdminUser) {
    document.getElementById("admin-tabs-wrap").style.display = "block";
    renderTopTabs();
  }
  renderModeTabs();
  showListScreen();
}

function renderModeTabs() {
  const wrap = document.getElementById("mode-tabs");
  wrap.innerHTML = `
    <button type="button" class="tab ${currentMode === "tickets" ? "active" : ""}" onclick="switchMode('tickets')">Обращения</button>
    <button type="button" class="tab ${currentMode === "ai" ? "active" : ""}" onclick="switchMode('ai')">AI-помощник</button>
  `;
}

function switchMode(mode) {
  if (currentMode === mode) return;
  currentMode = mode;
  renderModeTabs();
  document.getElementById("tickets-mode").style.display = mode === "tickets" ? "block" : "none";
  document.getElementById("ai-screen").style.display = mode === "ai" ? "block" : "none";
  if (mode === "tickets") {
    showListScreen();
  } else {
    stopPolling();
    renderAiChat();
  }
}

function renderTopTabs() {
  const wrap = document.getElementById("top-tabs");
  wrap.innerHTML = `
    <button type="button" class="tab ${currentTopTab === "mine" ? "active" : ""}" onclick="switchTopTab('mine')">Мои обращения</button>
    <button type="button" class="tab ${currentTopTab === "review" ? "active" : ""}" onclick="switchTopTab('review')">Рассмотрение обращений</button>
  `;
}
function switchTopTab(tab) {
  currentTopTab = tab;
  renderTopTabs();
  document.getElementById("review-subtabs-wrap").style.display = tab === "review" ? "block" : "none";
  document.getElementById("create-btn-row").style.display = tab === "review" ? "none" : "block";
  if (tab === "review") renderReviewSubtabs();
  loadTicketsList();
}
function renderReviewSubtabs() {
  const wrap = document.getElementById("review-subtabs");
  const tabs = [["active", "Активные"], ["new", "На рассмотрении"], ["closed", "Закрытые"]];
  wrap.innerHTML = tabs.map(([key, label]) =>
    `<button type="button" class="tab ${currentReviewSubtab === key ? "active" : ""}" onclick="switchReviewSubtab('${key}')">${label}</button>`
  ).join("");
}
function switchReviewSubtab(key) {
  currentReviewSubtab = key;
  renderReviewSubtabs();
  loadTicketsList();
}

function showListScreen() {
  document.getElementById("list-screen").style.display = "block";
  document.getElementById("detail-screen").style.display = "none";
  stopPolling();
  loadTicketsList();
}

async function loadTicketsList() {
  const listEl = document.getElementById("tickets-list");
  listEl.innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    const scope = (isAdminUser && currentTopTab === "review") ? "all" : "";
    const tickets = await apiFetch(`/api/support/tickets${scope ? "?scope=all" : ""}`);

    let filtered = tickets;
    if (isAdminUser && currentTopTab === "review") {
      filtered = tickets.filter(t => t.status === currentReviewSubtab);
    }

    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty">Обращений пока нет.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(t => ticketRowHTML(t, isAdminUser && currentTopTab === "review")).join("");
  } catch (e) {
    listEl.innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`;
  }
}

function ticketRowHTML(t, isReview) {
  const dateStr = new Date(t.created_at).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });
  return `
  <div class="ticket-row" onclick="openTicket('${t.id}', ${isReview})">
    <div class="ticket-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <div class="ticket-info">
      <div class="ticket-subject">${t.subject}</div>
      <div class="ticket-meta">
        <span>${CATEGORY_LABELS[t.category] || t.category}</span>
        <span>· ${dateStr}</span>
        ${isReview ? `<span>· ${t.username}</span>` : ""}
      </div>
    </div>
    <div class="ticket-right">
      <span class="status-pill ${t.status}">${STATUS_LABELS[t.status]}</span>
    </div>
  </div>`;
}

function openCreateModal() {
  document.getElementById("create-error").style.display = "none";
  document.getElementById("new-ticket-subject").value = "";
  document.getElementById("new-ticket-message").value = "";
  document.getElementById("new-ticket-category").value = "product";
  document.getElementById("create-overlay").classList.add("active");
}
function closeCreateModal() {
  document.getElementById("create-overlay").classList.remove("active");
}
async function submitTicket(e) {
  e.preventDefault();
  const subject = document.getElementById("new-ticket-subject").value.trim();
  const category = document.getElementById("new-ticket-category").value;
  const message = document.getElementById("new-ticket-message").value.trim();
  const errEl = document.getElementById("create-error");
  const btn = document.getElementById("create-submit-btn");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Отправка...";
  try {
    await apiFetch("/api/support/tickets", { method: "POST", body: JSON.stringify({ subject, category, message }) });
    closeCreateModal();
    loadTicketsList();
  } catch (e2) {
    errEl.textContent = e2.message;
    errEl.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Отправить обращение";
  }
}

async function openTicket(id, isReview) {
  currentTicketId = id;
  currentTicketIsReview = isReview;
  lastRenderedSignature = null;
  document.getElementById("list-screen").style.display = "none";
  document.getElementById("detail-screen").style.display = "block";
  document.getElementById("ticket-detail-body").innerHTML = '<div class="empty">Загрузка...</div>';
  await loadTicketDetail(true);
  startPolling();
}
function closeDetail() {
  currentTicketId = null;
  stopPolling();
  showListScreen();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => loadTicketDetail(false), 4000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function getChatInputState() {
  const input = document.getElementById("chat-input");
  if (!input) return null;
  return {
    value: input.value,
    selectionStart: input.selectionStart,
    selectionEnd: input.selectionEnd,
    focused: document.activeElement === input
  };
}
function restoreChatInputState(state) {
  const input = document.getElementById("chat-input");
  if (!input || !state) return;
  input.value = state.value;
  if (state.focused) {
    input.focus();
    try { input.setSelectionRange(state.selectionStart, state.selectionEnd); } catch (e) {}
  }
}

async function loadTicketDetail(scrollToBottom) {
  if (!currentTicketId) return;
  try {
    const { ticket, messages } = await apiFetch(`/api/support/messages?ticket_id=${encodeURIComponent(currentTicketId)}`);

    // Подпись состояния чата: статус + кол-во сообщений + id последнего.
    // Если с прошлого опроса ничего не изменилось — вообще не трогаем DOM,
    // чтобы не сбрасывать то, что человек сейчас печатает в поле ввода.
    const lastMsg = messages.length ? messages[messages.length - 1] : null;
    const signature = `${ticket.status}:${messages.length}:${lastMsg ? lastMsg.id : ""}`;
    if (!scrollToBottom && signature === lastRenderedSignature) {
      return;
    }
    lastRenderedSignature = signature;

    const inputState = getChatInputState();
    renderTicketDetail(ticket, messages, scrollToBottom);
    if (!scrollToBottom) restoreChatInputState(inputState);
  } catch (e) {
    document.getElementById("ticket-detail-body").innerHTML = `<div class="empty">Ошибка: ${e.message}</div>`;
    stopPolling();
  }
}

function renderTicketDetail(ticket, messages, scrollToBottom) {
  const isClosed = ticket.status === "closed";
  const dateStr = new Date(ticket.created_at).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" });

  const statusControls = (isAdminUser && currentTicketIsReview) ? `
    <div class="status-controls">
      <button type="button" class="${ticket.status === "new" ? "current" : ""}" onclick="setTicketStatus('new')">На рассмотрении</button>
      <button type="button" class="${ticket.status === "active" ? "current" : ""}" onclick="setTicketStatus('active')">Активное</button>
      <button type="button" class="${ticket.status === "closed" ? "current" : ""}" onclick="setTicketStatus('closed')">Закрыть</button>
    </div>` : "";

  const chatHTML = messages.map(m => {
    const mine = m.sender_id === currentUser.id;
    const who = m.sender_role === "admin" ? "Поддержка" : (ticket.username || "Пользователь");
    const time = new Date(m.created_at).toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    return `
      <div class="msg-row ${mine ? "mine" : ""}">
        <div>
          <div class="msg-bubble">${escapeHTML(m.body)}</div>
          <div class="msg-meta">${mine ? "Вы" : who} · ${time}</div>
        </div>
      </div>`;
  }).join("");

  document.getElementById("ticket-detail-body").innerHTML = `
    <div class="ticket-detail-head">
      <div class="ticket-detail-top">
        <div>
          <div class="ticket-detail-subject">${ticket.subject}</div>
          <div class="ticket-detail-meta">${CATEGORY_LABELS[ticket.category] || ticket.category} · ${dateStr}${currentTicketIsReview ? " · " + ticket.username : ""}</div>
        </div>
        <span class="status-pill ${ticket.status}">${STATUS_LABELS[ticket.status]}</span>
      </div>
      ${statusControls}
    </div>
    <div class="chat-box" id="chat-box">${chatHTML || '<div class="empty">Сообщений пока нет.</div>'}</div>
    ${isClosed
      ? '<div class="closed-notice"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Обращение закрыто — переписка недоступна</div>'
      : `<div class="chat-input-row">
          <textarea id="chat-input" rows="1" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChatMessage();}"></textarea>
          <button type="button" class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>`}
  `;
  if (scrollToBottom) {
    const box = document.getElementById("chat-box");
    if (box) box.scrollIntoView({ block: "end" });
  }
}

function escapeHTML(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function sendChatMessage() {
  const input = document.getElementById("chat-input");
  const body = input.value.trim();
  if (!body || !currentTicketId) return;
  const btn = document.getElementById("chat-send-btn");
  btn.disabled = true;
  input.value = "";
  try {
    await apiFetch("/api/support/messages", { method: "POST", body: JSON.stringify({ ticket_id: currentTicketId, body }) });
    await loadTicketDetail(true);
  } catch (e) {
    alert(e.message);
    input.value = body;
  } finally {
    btn.disabled = false;
  }
}

async function setTicketStatus(status) {
  if (!currentTicketId) return;
  try {
    await apiFetch("/api/support/status", { method: "PUT", body: JSON.stringify({ ticket_id: currentTicketId, status }) });
    await loadTicketDetail(false);
  } catch (e) {
    alert(e.message);
  }
}

function renderAiChat() {
  const box = document.getElementById("ai-chat-box");
  if (!aiMessages.length) {
    box.innerHTML = '<div class="empty">Задайте вопрос AI-помощнику — поможет разобраться с товаром, оплатой или аккаунтом. Для действий с конкретным заказом он предложит создать обращение.</div>';
  } else {
    box.innerHTML = aiMessages.map(m => `
      <div class="msg-row ${m.role === "user" ? "mine" : ""}">
        <div>
          <div class="msg-bubble">${m.pending ? "···" : escapeHTML(m.content)}</div>
          <div class="msg-meta">${m.role === "user" ? "Вы" : "AI-помощник"}</div>
        </div>
      </div>`).join("");
  }
  box.scrollIntoView({ block: "end" });
}

async function sendAiMessage() {
  const input = document.getElementById("ai-chat-input");
  const text = input.value.trim();
  if (!text || aiSending) return;

  aiMessages.push({ role: "user", content: text });
  input.value = "";
  renderAiChat();

  aiSending = true;
  const btn = document.getElementById("ai-send-btn");
  btn.disabled = true;
  aiMessages.push({ role: "assistant", content: "", pending: true });
  renderAiChat();

  try {
    const { reply } = await apiFetch("/api/support/ai-chat", {
      method: "POST",
      body: JSON.stringify({ messages: aiMessages.filter(m => !m.pending).map(m => ({ role: m.role, content: m.content })) })
    });
    aiMessages = aiMessages.filter(m => !m.pending);
    aiMessages.push({ role: "assistant", content: reply });
  } catch (e) {
    aiMessages = aiMessages.filter(m => !m.pending);
    aiMessages.push({ role: "assistant", content: `⚠️ ${e.message}` });
  } finally {
    aiSending = false;
    btn.disabled = false;
    renderAiChat();
  }
}

function applyTelegramViewportHeight() {
  const tg = window.Telegram?.WebApp;
  if (!tg) return;
  const h = tg.viewportStableHeight || tg.viewportHeight;
  if (h) document.documentElement.style.setProperty("--tg-vh", `${h}px`);
}

(async () => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    applyTelegramViewportHeight();
    tg.onEvent("viewportChanged", applyTelegramViewportHeight);
  }
  await initSupabase();
  if (!supabaseClient) {
    document.getElementById("loading-screen").innerHTML = '<div class="empty">Нет подключения к серверу.</div>';
    return;
  }
  await bootApp();
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (!session?.user) {
      currentUser = null;
      document.getElementById("app-screen").style.display = "none";
      document.getElementById("auth-screen").style.display = "block";
    }
  });
})();
</script>
